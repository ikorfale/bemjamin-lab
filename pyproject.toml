[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "branchpoint-agent-traces"
version = "0.1.0"
description = "Offline reliability microscope for repeated AI-agent tool trajectories"
readme = "experiments/001-branchpoint/README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "bemjamin-sour-soup"}]

[project.scripts]
branchpoint = "branchpoint.__main__:main"

[tool.setuptools]
packages = ["branchpoint"]

